name: Guardian adapter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Run build, tests, and live conformance
        run: bash scripts/ci-conformance.sh
      - name: Upload caller-owned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-foundation-guardian-adapter-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-foundation-guardian-adapter-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
